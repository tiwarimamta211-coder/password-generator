<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Secure & Strong Passwords</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --primary-dark: #5568d3;
            --secondary-color: #764ba2;
            --success-color: #48bb78;
            --warning-color: #ed8936;
            --danger-color: #f56565;
            --light-bg: #f7fafc;
            --white: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --border-color: #e2e8f0;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 35px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: var(--white);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-card {
            background: var(--white);
            border-radius: 16px;
            padding: 30px;
            box-shadow: var(--shadow-lg);
            margin-bottom: 20px;
        }

        .password-display {
            background: var(--light-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .password-display:hover {
            border-color: var(--primary-color);
            background: #f0f4ff;
        }

        .password-text {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            color: var(--text-dark);
            min-height: 24px;
        }

        .password-display.empty .password-text {
            color: var(--text-light);
            font-style: italic;
        }

        .btn-icon {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .btn-icon:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-icon:active {
            transform: translateY(0);
        }

        .btn-icon.copied {
            background: var(--success-color);
        }

        .control-group {
            margin-bottom: 24px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }

        .control-value {
            background: var(--primary-color);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.6);
        }

        .checkboxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: var(--light-bg);
        }

        .checkbox-wrapper:hover {
            background: #edf2f7;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .checkbox-wrapper label {
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
            margin: 0;
        }

        .strength-meter {
            margin-bottom: 24px;
        }

        .strength-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .strength-bar {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            transition: all 0.3s ease;
            background: var(--danger-color);
        }

        .strength-fill.weak {
            width: 25%;
            background: var(--danger-color);
        }

        .strength-fill.fair {
            width: 50%;
            background: var(--warning-color);
        }

        .strength-fill.good {
            width: 75%;
            background: #38a169;
        }

        .strength-fill.strong {
            width: 100%;
            background: var(--success-color);
        }

        .strength-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
        }

        .strength-text.weak {
            color: var(--danger-color);
        }

        .strength-text.fair {
            color: var(--warning-color);
        }

        .strength-text.good {
            color: #38a169;
        }

        .strength-text.strong {
            color: var(--success-color);
        }

        .strength-details {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 8px;
            padding: 8px;
            background: var(--light-bg);
            border-radius: 6px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-icon {
            font-size: 12px;
            width: 16px;
            text-align: center;
        }

        .detail-icon.yes {
            color: var(--success-color);
        }

        .detail-icon.no {
            color: var(--text-light);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--light-bg);
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            background: #f0f4ff;
            color: var(--primary-color);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success-color);
            color: var(--white);
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.show {
            display: flex;
        }

        .toast.hide {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .ads-container {
            margin-top: 30px;
        }

        .ads-label {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-bottom: 15px;
        }

        .ad-space {
            background: var(--white);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            color: var(--text-light);
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .main-card {
                padding: 20px;
            }

            .checkboxes {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .toast {
                right: 10px;
                left: 10px;
                bottom: 10px;
            }

            .control-group {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 320px) {
            .header h1 {
                font-size: 20px;
            }

            .main-card {
                padding: 16px;
            }

            .password-display {
                padding: 12px;
            }

            .btn-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --light-bg: #2d3748;
                --white: #1a202c;
                --text-dark: #e2e8f0;
                --text-light: #a0aec0;
                --border-color: #4a5568;
            }

            body {
                background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            }

            .password-display:hover {
                background: #2d3748;
            }

            .checkbox-wrapper:hover {
                background: #4a5568;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-lock"></i> Password Generator</h1>
            <p>Create strong, secure passwords instantly</p>
        </div>

        <div class="main-card">
            <!-- Password Display -->
            <div class="password-display empty" id="passwordDisplay">
                <span class="password-text" id="passwordText">Click "Generate" to create a password</span>
                <button class="btn-icon" id="copyBtn" title="Copy password" style="display:none;">
                    <i class="fas fa-copy"></i>
                </button>
                <button class="btn-icon" id="refreshBtn" title="Generate new password" style="display:none;">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>

            <!-- Strength Meter -->
            <div class="strength-meter">
                <div class="strength-label">
                    <span>Password strength</span>
                    <span class="strength-text" id="strengthText">-</span>
                </div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-details" id="strengthDetails">
                    <div class="detail-item">
                        <span class="detail-icon no" id="lengthIcon">✗</span>
                        <span>Length: <span id="lengthValue">0</span></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon no" id="capitalIcon">✗</span>
                        <span>Capitals</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon no" id="numberIcon">✗</span>
                        <span>Numbers</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-icon no" id="symbolIcon">✗</span>
                        <span>Symbols</span>
                    </div>
                </div>
            </div>

            <!-- Length Slider -->
            <div class="control-group">
                <div class="control-label">
                    <span>Password Length</span>
                    <span class="control-value" id="lengthValue">16</span>
                </div>
                <input type="range" id="lengthSlider" min="8" max="64" value="16">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-light); margin-top: 8px;">
                    <span>8</span>
                    <span>64</span>
                </div>
            </div>

            <!-- Character Options -->
            <div class="control-group">
                <div class="control-label">Character Types</div>
                <div class="checkboxes">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="uppercase" checked>
                        <label for="uppercase">Uppercase (A-Z)</label>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">Lowercase (a-z)</label>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="numbers" checked>
                        <label for="numbers">Numbers (0-9)</label>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="symbols" checked>
                        <label for="symbols">Symbols (!@#$%)</label>
                    </div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button class="btn btn-primary" id="generateBtn">
                    <i class="fas fa-wand-magic-sparkles"></i> Generate
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Google Ads Placeholder -->
        <div class="ads-container">
            <div class="ads-label">Advertisements</div>
            <div class="ad-space">
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-xxxxxxxxxxxxxxxx"></script>
                <!-- Responsive Ad Unit -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
                     data-ad-slot="0000000000"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Password copied to clipboard!</span>
    </div>

    <script>
        // Password Generator Logic
        class PasswordGenerator {
            constructor() {
                this.uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                this.lowercase = 'abcdefghijklmnopqrstuvwxyz';
                this.numbers = '0123456789';
                this.symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
                this.password = '';
                this.init();
            }

            init() {
                this.setupEventListeners();
            }

            setupEventListeners() {
                document.getElementById('generateBtn').addEventListener('click', () => this.generate());
                document.getElementById('refreshBtn').addEventListener('click', () => this.generate());
                document.getElementById('copyBtn').addEventListener('click', () => this.copyPassword());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('lengthSlider').addEventListener('input', (e) => this.updateLength(e));
                
                document.getElementById('uppercase').addEventListener('change', () => this.generate());
                document.getElementById('lowercase').addEventListener('change', () => this.generate());
                document.getElementById('numbers').addEventListener('change', () => this.generate());
                document.getElementById('symbols').addEventListener('change', () => this.generate());
            }

            updateLength(e) {
                document.getElementById('lengthValue').textContent = e.target.value;
                if (this.password) {
                    this.generate();
                }
            }

            getCharacterSet() {
                let chars = '';
                if (document.getElementById('uppercase').checked) chars += this.uppercase;
                if (document.getElementById('lowercase').checked) chars += this.lowercase;
                if (document.getElementById('numbers').checked) chars += this.numbers;
                if (document.getElementById('symbols').checked) chars += this.symbols;
                return chars;
            }

            generate() {
                const length = parseInt(document.getElementById('lengthSlider').value);
                const charset = this.getCharacterSet();

                if (charset.length === 0) {
                    this.showToast('Please select at least one character type', 'error');
                    return;
                }

                let password = '';
                for (let i = 0; i < length; i++) {
                    password += charset.charAt(Math.floor(Math.random() * charset.length));
                }

                this.password = password;
                this.displayPassword();
                this.calculateStrength();
                this.showButtons();
            }

            displayPassword() {
                const display = document.getElementById('passwordDisplay');
                const text = document.getElementById('passwordText');
                
                text.textContent = this.password;
                display.classList.remove('empty');
            }

            showButtons() {
                document.getElementById('copyBtn').style.display = 'flex';
                document.getElementById('refreshBtn').style.display = 'flex';
            }

            copyPassword() {
                navigator.clipboard.writeText(this.password).then(() => {
                    this.showToast('Password copied to clipboard!', 'success');
                    const btn = document.getElementById('copyBtn');
                    btn.classList.add('copied');
                    setTimeout(() => btn.classList.remove('copied'), 2000);
                }).catch(() => {
                    this.showToast('Failed to copy password', 'error');
                });
            }

            calculateStrength() {
                const length = this.password.length;
                const hasUppercase = /[A-Z]/.test(this.password);
                const hasLowercase = /[a-z]/.test(this.password);
                const hasNumbers = /[0-9]/.test(this.password);
                const hasSymbols = /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(this.password);

                // Update detail icons
                document.getElementById('lengthIcon').className = length >= 16 ? 'detail-icon yes' : 'detail-icon no';
                document.getElementById('lengthIcon').textContent = length >= 16 ? '✓' : '✗';
                document.getElementById('capitalIcon').className = hasUppercase ? 'detail-icon yes' : 'detail-icon no';
                document.getElementById('capitalIcon').textContent = hasUppercase ? '✓' : '✗';
                document.getElementById('numberIcon').className = hasNumbers ? 'detail-icon yes' : 'detail-icon no';
                document.getElementById('numberIcon').textContent = hasNumbers ? '✓' : '✗';
                document.getElementById('symbolIcon').className = hasSymbols ? 'detail-icon yes' : 'detail-icon no';
                document.getElementById('symbolIcon').textContent = hasSymbols ? '✓' : '✗';

                // Calculate strength score
                let score = 0;
                if (length >= 12) score += 1;
                if (length >= 16) score += 1;
                if (hasUppercase) score += 1;
                if (hasLowercase) score += 1;
                if (hasNumbers) score += 1;
                if (hasSymbols) score += 1;

                // Determine strength level
                let strength = 'Weak';
                let strengthClass = 'weak';

                if (score <= 2) {
                    strength = 'Weak';
                    strengthClass = 'weak';
                } else if (score <= 3) {
                    strength = 'Fair';
                    strengthClass = 'fair';
                } else if (score <= 4) {
                    strength = 'Good';
                    strengthClass = 'good';
                } else {
                    strength = 'Strong';
                    strengthClass = 'strong';
                }

                // Update UI
                document.getElementById('strengthText').textContent = strength;
                document.getElementById('strengthText').className = `strength-text ${strengthClass}`;
                const fill = document.getElementById('strengthFill');
                fill.className = `strength-fill ${strengthClass}`;
            }

            reset() {
                document.getElementById('lengthSlider').value = 16;
                document.getElementById('lengthValue').textContent = '16';
                document.getElementById('uppercase').checked = true;
                document.getElementById('lowercase').checked = true;
                document.getElementById('numbers').checked = true;
                document.getElementById('symbols').checked = true;
                
                const display = document.getElementById('passwordDisplay');
                const text = document.getElementById('passwordText');
                text.textContent = 'Click "Generate" to create a password';
                display.classList.add('empty');
                
                document.getElementById('copyBtn').style.display = 'none';
                document.getElementById('refreshBtn').style.display = 'none';
                
                document.getElementById('strengthText').textContent = '-';
                document.getElementById('strengthText').className = 'strength-text';
                document.getElementById('strengthFill').className = 'strength-fill';
                
                this.password = '';
            }

            showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const messageEl = document.getElementById('toastMessage');
                messageEl.textContent = message;
                
                toast.classList.add('show');
                toast.classList.remove('hide');
                
                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => {
                        toast.classList.remove('show', 'hide');
                    }, 300);
                }, 3000);
            }
        }

        // Initialize
        const generator = new PasswordGenerator();
    </script>
</body>
</html>
